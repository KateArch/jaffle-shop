models:
  - name: customers
    description: >
      Customer-level mart with one row per customer. Starts from `stg_customers`
      and adds lifetime order activity and spend rollups from `orders` for
      customer reporting, segmentation, and downstream metrics.
    columns:
      - name: customer_id
        description: Primary key for the customer record.
        data_tests:
          - not_null
          - unique
      - name: customer_name
        description: Customer name from the source customer record.
      - name: count_lifetime_orders
        description: Total number of distinct orders placed by the customer across all time.
      - name: first_ordered_at
        description: Timestamp of the customer's first recorded order.
      - name: last_ordered_at
        description: Timestamp of the customer's most recent recorded order.
      - name: lifetime_spend_pretax
        description: Total pretax order subtotal summed across all customer orders.
      - name: lifetime_tax_paid
        description: Total tax paid summed across all customer orders.
      - name: lifetime_spend
        description: Total amount spent by the customer including tax.
      - name: customer_type
        description: Customer segment derived from order history, marked as `new` for a single order and `returning` for multiple orders.
